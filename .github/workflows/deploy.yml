name: Deploy to GitHub Pages

on:
  push:
    branches: [luisa-landing]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # Project pages are served from /<repo>, so assets need the prefix
          NEXT_PUBLIC_BASE_PATH: /luisa-landing
          NEXT_PUBLIC_SITE_URL: https://lumaher-ai.github.io/luisa-landing
        run: npm run build

      - name: Add .nojekyll
        # Without this, GitHub Pages' Jekyll step strips the _next directory
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
